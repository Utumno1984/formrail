<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found · Formrail</title>
  </head>
  <body>
    <!-- Static on purpose: no script, so an unknown URL can never enter a redirect loop. Pages serves
         this file for a missing path at any depth, hence the link is absolute; {{SITE_BASE}} is filled
         in by scripts/assemble-site.mjs from the single prefix constant. -->
    <h1>Page not found</h1>
    <p><a href="{{SITE_BASE}}storybook/">Open the Formrail Storybook</a></p>
    <p><a href="{{SITE_BASE}}privacy/">Privacy</a></p>
  </body>
</html>
