    <title>react-object-page</title>
    <script>
      /*REDIRECT_FN*/
      var target = resolveRedirect(location.href, 'index');
      // replace(), not assign(): the intermediate page must not stay in the history, or Back from
      // the Storybook would land here and redirect again.
      if (target) location.replace(target);
    </script>
