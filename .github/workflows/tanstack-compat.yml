name: TanStack Form compat

# Ticket #563, maintainer decision B (16/11/2026). The Pro adapter of TanStack Form reads non-public internals, so the
# peer range is `~1.33.5` and a new 1.x minor can break it without any PR of ours noticing. Once a week (and on
# demand) this runs the suite of the binding against the newest `@tanstack/react-form@1` (stays on 1.x even after a
# 2.0 is published: see scripts/tanstack-compat.mjs). It is a SEPARATE workflow on purpose: it runs on no pull
# request and is not among the required checks of the main ruleset, so a TanStack release never blocks an
# unrelated PR. Do not add or rename jobs of ci.yml for it.
#
# Alert: the workflow run turns red (and GitHub notifies the owner of the schedule), with the tested version in the
# job summary. No issue is opened: that would need a write token (`issues: write`) for a run that should have none,
# plus dedup logic for a week-after-week failure. Note: GitHub disables scheduled workflows after 60 days without
# repository activity.
#
# Proof that it fails and passes (run by hand: Actions > TanStack Form compat > Run workflow, field `version`):
# `1.33.5` passes, `1.20.0` (other internals) fails. The same locally: `node scripts/tanstack-compat.mjs 1.20.0`.
on:
  schedule:
    # Mondays 06:17 UTC (an off-the-hour minute: scheduled runs on the hour are the ones GitHub delays most).
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version or range of @tanstack/react-form inside 1.x (empty: ^1, the newest 1.x)'
        required: false
        default: ''
        type: string

# Read-only token, nothing else: the run writes nothing to the repository.
permissions:
  contents: read

concurrency:
  group: tanstack-compat
  cancel-in-progress: false

jobs:
  compat:
    name: tanstack form compat
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Built with the locked version (the dist tests read the built adapter); only then the version under test is
      # installed, without saving it.
      - run: npm run build
      - name: Run the TanStack Form binding suite against the requested version
        env:
          # Through the environment, never interpolated into the shell command.
          VERSION: ${{ inputs.version }}
        run: |
          set -o pipefail
          node scripts/tanstack-compat.mjs "$VERSION" 2>&1 | tee compat.log
      - name: Summary
        if: always()
        run: |
          {
            echo "### TanStack Form compat"
            echo
            grep -E '^tanstack-compat:' compat.log || echo "No version was tested (see the log above)."
          } >> "$GITHUB_STEP_SUMMARY"
