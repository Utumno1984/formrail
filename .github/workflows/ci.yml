name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Manual run: lets the Pages deploy be exercised for real before merging (see deploy-pages).
  workflow_dispatch:

# Read-only token: the workflow never writes (also safe for PRs from forks).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Runner: pinned to ubuntu-24.04 instead of ubuntu-latest on purpose. `ubuntu-latest` migrates to
# a new image on a date GitHub picks, silently changing the toolchain under every job (and the
# host of the e2e job, which installs browsers and system deps). A pinned image turns the
# migration into a reviewed PR. Revisit when ubuntu-24.04 nears end of support. The visual job
# runs in a pinned container, so the host image does not affect its screenshots.
# Actions: all on majors running the node24 runtime (checkout v7, setup-node v7, upload-artifact v7).
jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Typechecks the tests too, which import the built dist types.
      - run: npm run build
      - run: npm run typecheck

  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  unit-test:
    name: unit test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:unit

  changeset:
    name: changeset
    # Only meaningful on a PR: it diffs the PR against its merge-base with main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history is required to compute the merge-base.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Fetch base branch
        run: git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
      - name: Check changeset
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: node scripts/check-changeset.mjs

  bundle:
    name: bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # Read-only check against the committed baseline; CI never rewrites it.
      - run: npm run bundle:check

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Firefox and WebKit run only the tests tagged @engines (playwright.config.ts).
      - run: npx playwright install --with-deps chromium firefox webkit
      # Builds Storybook, serves it locally and runs the Playwright suite.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Distinct check from the functional e2e. Runs in the official Playwright image, the SAME one
  # `npm run test:visual` uses locally (tag = exact @playwright/test version, pinned by digest
  # because tags on MCR are mutable; a unit test in scripts/visual-docker.test.mjs fails if they
  # drift apart). To update it see the comment on PLAYWRIGHT_IMAGE_DIGEST in
  # scripts/visual-docker.mjs: new digest + new @playwright/test version + regenerated baselines
  # go together. Baselines are never created here.
  visual:
    name: visual
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:visual:ci
      # Baseline PNGs left behind by a renamed/removed story (#517). Reuses the storybook-static/ that the
      # webServer of the step above just built (no extra build); runs even if a screenshot failed.
      - run: npm run test:visual:orphans
        if: success() || failure()
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-diff
          # test-results/ holds the expected / actual / diff PNG of every failing screenshot.
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Publishes the site (Storybook under /storybook/) to GitHub Pages. Runs only after every gate above is green, and
  # only on push to main (or a manual dispatch) - never on pull requests. The workflow-level token
  # stays read-only; this job alone gets the Pages permissions. Only the Free core stories are built
  # (STORYBOOK_EXCLUDE_PRO=1 in the build step drops the packages/pro stories and CSS, see
  # .storybook/story-globs.mjs); a future Pro demo needs its own build.
  deploy-pages:
    name: deploy storybook
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [lint, typecheck, build, unit-test, bundle, e2e, visual]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # Placeholder guard (ticket #490): fails the deploy, in seconds and before any build, while the waitlist
      # form URL or the privacy email in scripts/site-config.mjs is still a stand-in. Only this job runs it:
      # PR builds assemble the site with the placeholders. `--strict` on the assembler below repeats the check.
      - run: node scripts/check-site-config.mjs
      - run: npm ci
      - run: npm run build
      # Free stories only: .storybook/story-globs.mjs leaves packages/pro (stories and CSS) out.
      - run: npm run build-storybook
        env:
          STORYBOOK_EXCLUDE_PRO: '1'
          # Test fixtures (tag `internal`) out of the public sidebar, see .storybook/manager.ts (#296).
          STORYBOOK_HIDE_INTERNAL: '1'
      # Pro demo: Pro stories + ProIntroduction.mdx only, with the "Pro preview" banner (#381). Script in
      # package.json: STORYBOOK_EDITION=pro + STORYBOOK_HIDE_INTERNAL=1, output storybook-static-pro/.
      - run: npm run build-storybook:pro
      # site/ = landing page at the root (#382; it still forwards old Storybook links) + storybook/ + pro/
      # (tickets #380, #381). The prefix comes from GITHUB_REPOSITORY, see scripts/site-config.mjs.
      - run: node scripts/assemble-site.mjs --strict
      # Pre-deploy smoke on the assembled folder, served locally under the same prefix as the live
      # site (not against the live site). If it fails, nothing below runs: no deploy.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5

  # Placed after deploy-pages on purpose: scripts/story-globs.test.mjs asserts that the jobs BEFORE deploy-pages
  # (e2e, visual) never set the public-site Storybook flags; this job must build exactly the published
  # artefact, so it carries them and lives below the marker.
  # Pre-merge run of the Pages smoke (e2e/site/, `npm run test:site`) on pull requests (ticket #490). Until
  # then it ran only in deploy-pages, i.e. after the merge: a broken landing, Pro page or privacy page was
  # found on main, with the deploy blocked. This job assembles the same site (Free + Pro Storybook + pages)
  # with the placeholder values of scripts/site-config.mjs, which is deliberate: PR builds must not need
  # the real form URL or email (only deploy-pages runs the placeholder guard). The cost is one extra
  # Storybook pair build and the site suite per PR; it runs in parallel with the other jobs.
  site:
    name: site smoke
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build-storybook
        env:
          STORYBOOK_EXCLUDE_PRO: '1'
          STORYBOOK_HIDE_INTERNAL: '1'
      - run: npm run build-storybook:pro
      - run: node scripts/assemble-site.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:site
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-site
          path: |
            playwright-report-site/
            test-results/
          retention-days: 7
